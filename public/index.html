<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YLBGZJL3TV"></script>
    <script>
        if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-YLBGZJL3TV');
        }
    </script>
    <title>Tension Grid</title>
    <meta name="description" content="Tension Grid - A retro-futuristic arcade game">
    <link rel="icon" type="image/png" href="img/ico/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Background Animation (hidden on game screen) -->
    <div class="bg-animation" id="bgAnimation">
        <div class="bg-grid"></div>
        <div class="bg-particles">
            <div class="bg-particle" style="--x: 3%; --delay: -8s"></div>
            <div class="bg-particle" style="--x: 7%; --delay: 6s"></div>
            <div class="bg-particle" style="--x: 12%; --delay: -4s"></div>
            <div class="bg-particle" style="--x: 17%; --delay: 8s"></div>
            <div class="bg-particle" style="--x: 22%; --delay: -6s"></div>
            <div class="bg-particle" style="--x: 27%; --delay: 4.5s"></div>
            <div class="bg-particle" style="--x: 32%; --delay: -2s"></div>
            <div class="bg-particle" style="--x: 37%; --delay: 3s"></div>
            <div class="bg-particle" style="--x: 42%; --delay: -7s"></div>
            <div class="bg-particle" style="--x: 47%; --delay: -1s"></div>
            <div class="bg-particle" style="--x: 52%; --delay: 5s"></div>
            <div class="bg-particle" style="--x: 57%; --delay: -3s"></div>
            <div class="bg-particle" style="--x: 62%; --delay: 7.5s"></div>
            <div class="bg-particle" style="--x: 67%; --delay: -5s"></div>
            <div class="bg-particle" style="--x: 72%; --delay: 10s"></div>
            <div class="bg-particle" style="--x: 77%; --delay: -9s"></div>
            <div class="bg-particle" style="--x: 82%; --delay: 6.5s"></div>
            <div class="bg-particle" style="--x: 87%; --delay: -2.5s"></div>
            <div class="bg-particle" style="--x: 92%; --delay: 8.5s"></div>
            <div class="bg-particle" style="--x: 97%; --delay: -6.5s"></div>
            <div class="bg-particle" style="--x: 10%; --delay: -4.5s"></div>
            <div class="bg-particle" style="--x: 25%; --delay: 7s"></div>
            <div class="bg-particle" style="--x: 45%; --delay: -7.5s"></div>
            <div class="bg-particle" style="--x: 60%; --delay: 5.5s"></div>
            <div class="bg-particle" style="--x: 75%; --delay: -3.5s"></div>
            <div class="bg-particle" style="--x: 90%; --delay: -8.5s"></div>
        </div>
    </div>

    <div class="game-container">
        <!-- Home Screen -->
        <div class="screen active" id="homeScreen">
            <h1 class="game-title" id="homeTitle">
                <span class="title-tension">TENSION</span>
                <span class="title-grid">GRID</span>
            </h1>
            <div class="menu" id="homeMenu">
                <button class="menu-button dev-only" data-action="gym">Gym</button>
                <button class="menu-button" data-action="continue">Continue</button>
                <button class="menu-button" data-action="levels">Levels</button>
                <button class="menu-button" data-action="upload">Upload</button>
                <button class="menu-button mobile-only" data-action="fullscreen">Fullscreen</button>
                <button class="menu-button" data-action="settings">Settings</button>
            </div>
            <input type="file" id="levelFileInput" accept=".json" style="display: none;">
        </div>

        <!-- Levels Screen -->
        <div class="screen" id="levelsScreen">
            <h2 class="screen-title">LEVELS</h2>
            <div class="timeline-container" id="levelTimeline">
                <div class="timeline-markers" id="timelineMarkers">
                    <!-- Markers generated by JS -->
                </div>
            </div>
            <div class="timeline-counter"><span class="current" id="levelCurrent">1</span> / <span id="levelTotal">10</span></div>
            <div class="timeline-hint">&larr; &rarr;</div>
        </div>

        <!-- Settings Screen -->
        <div class="screen" id="settingsScreen">
            <h2 class="screen-title">SETTINGS</h2>
            <div class="settings-panel">
                <div class="settings-item">
                    <span class="settings-label">Audio</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="audioToggle" checked>
                        <span class="toggle-track">
                            <span class="toggle-thumb"></span>
                        </span>
                    </label>
                </div>
                <div class="settings-item version-info">
                    <span class="version-value" id="versionDisplay"></span>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div class="screen" id="gameScreen">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="gameCanvas"></canvas>
            </div>

            <!-- Pause Menu -->
            <div class="pause-overlay" id="pauseOverlay">
                <div class="pause-modal">
                    <h2 class="pause-title">PAUSED</h2>
                    <div class="menu">
                        <button class="menu-button selected" data-action="continue">Resume</button>
                        <button class="menu-button" data-action="restart">Restart</button>
                        <button class="menu-button" data-action="quit">Quit</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts in dependency order -->
    <script src="js/main/constants.js"></script>
    <script src="js/io/error_notifier.js"></script>
    <script src="js/io/local_storage.js"></script>
    <script src="js/engine/vector2.js"></script>
    <script src="js/engine/grid.js"></script>
    <script src="js/ui/camera.js"></script>
    <script src="js/io/input_manager.js"></script>
    <script src="js/effects/effect.js"></script>
    <script src="js/effects/effect_types.js"></script>
    <script src="js/effects/effect_manager.js"></script>
    <script src="js/helpers/analytics.js"></script>
    <script src="js/helpers/wake_trail.js"></script>
    <script src="js/helpers/intermittent_state.js"></script>
    <script src="js/helpers/grid_movement.js"></script>
    <script src="js/helpers/particle_explosion.js"></script>
    <script src="js/engine/player.js"></script>
    <script src="js/animations/player_explosion_animation.js"></script>
    <script src="js/animations/player_wrap_animation.js"></script>
    <script src="js/animations/player_exit_animation.js"></script>
    <script src="js/animations/collection_wave_animation.js"></script>
    <script src="js/animations/mine_explosion_animation.js"></script>
    <script src="js/engine/power.js"></script>
    <script src="js/engine/exit.js"></script>
    <script src="js/engine/switch.js"></script>
    <script src="js/engine/wall.js"></script>
    <script src="js/enemies/enemy_bullet.js"></script>
    <script src="js/enemies/enemy_laser.js"></script>
    <script src="js/enemies/enemy_trap.js"></script>
    <script src="js/enemies/enemy_mine.js"></script>
    <script src="js/enemies/enemy_shooter.js"></script>
    <script src="js/enemies/enemy_patrol.js"></script>
    <script src="js/enemies/enemy_follower.js"></script>
    <script src="js/io/audio_manager.js"></script>
    <script src="js/enemies/enemy_manager.js"></script>
    <script src="js/engine/collision.js"></script>
    <script src="js/ui/renderer.js"></script>
    <script src="js/io/ui_manager.js"></script>
    <script src="js/ui/screen.js"></script>
    <script src="js/engine/game.js"></script>
    <script src="js/main/main.js"></script>
</body>
</html>
